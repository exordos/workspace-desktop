name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  lint:
    name: Architecture lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo check-architecture

  test:
    name: Tests (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked --workspace --no-default-features

  macos:
    name: macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
    env:
      RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal
      - run: cargo build --locked --release --target ${{ matrix.target }} -p workspace-desktop --bin workspace-desktop
      - name: Bundle and verify the app
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          app="$(sh scripts/bundle-workspace-desktop-macos.sh "target/$TARGET/release/workspace-desktop")"
          codesign --verify --strict "$app"
          executable="$app/Contents/MacOS/workspace-desktop"
          lipo "$executable" -verify_arch "$ARCH"
          "$executable" --help
          ditto -c -k --keepParent "$app" "workspace-desktop-macos-$ARCH.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: workspace-desktop-macos-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux app (x64)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-linux-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: workspace-desktop-linux-x64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows app (x64)
    needs: lint
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
      - name: Build and verify the executable
        shell: pwsh
        run: |
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $fxc = Get-ChildItem (Join-Path $sdkBin '10.*/x64/fxc.exe') -File |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe was not found' }
          $env:GPUI_FXC_PATH = $fxc.FullName
          cargo +stable-x86_64-pc-windows-msvc build --locked --release --target x86_64-pc-windows-msvc -p workspace-desktop --bin workspace-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = 'target/x86_64-pc-windows-msvc/release/workspace-desktop.exe'
          $archive = 'workspace-desktop-windows-x64.zip'
          Compress-Archive -LiteralPath $exe -DestinationPath $archive
          $verify = Join-Path $env:RUNNER_TEMP 'workspace-desktop-windows-x64'
          Expand-Archive -LiteralPath $archive -DestinationPath $verify
          $packagedExe = Join-Path $verify 'workspace-desktop.exe'
          $stream = [System.IO.File]::OpenRead($packagedExe)
          try {
            $header = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $stream.Position = $header.ReadUInt32()
            if ($header.ReadUInt32() -ne 0x4550 -or $header.ReadUInt16() -ne 0x8664) {
              throw 'Expected an x64 PE executable'
            }
          } finally {
            $stream.Dispose()
          }
          $helpText = & $packagedExe --help
          if ($LASTEXITCODE -ne 0 -or $helpText -notlike 'Usage: workspace-desktop *') {
            throw 'The packaged Windows executable failed the smoke test'
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: workspace-desktop-windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  package_macos_release:
    name: Prepare macOS release packages
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created
    needs: macos
    runs-on: macos-15
    environment: macos-release
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: workspace-desktop-macos-*.zip
          path: macos-builds
          merge-multiple: true
          skip-decompress: true
      - name: Use Apple signing when configured
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          secret_names=(MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD
            APPLE_API_PRIVATE_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID)
          missing_secrets=()
          for name in "${secret_names[@]}"; do
            if [[ -z "${!name}" ]]; then
              missing_secrets+=("$name")
            fi
          done
          if (( ${#missing_secrets[@]} == ${#secret_names[@]} )); then
            echo '::warning::Apple signing is not configured. The macOS release will use the ad hoc ZIPs.'
            mkdir release-macos
            cp macos-builds/workspace-desktop-macos-{x86_64,arm64}.zip release-macos/
            exit 0
          fi
          if (( ${#missing_secrets[@]} > 0 )); then
            printf '::error::Missing macOS release secret: %s\n' "${missing_secrets[@]}"
            exit 1
          fi

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/workspace-signing.XXXXXX")
          keychain="$signing_dir/signing.keychain-db"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -rf "$signing_dir"' EXIT
          keychain_password=$(openssl rand -hex 32)
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$signing_dir/certificate.p12"
          printf '%s' "$APPLE_API_PRIVATE_KEY_P8_BASE64" | base64 -D > "$signing_dir/AuthKey.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/certificate.p12" -f pkcs12 -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" |
            awk '/"Developer ID Application: / { print $2 }')
          if [[ ! "$identity" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo '::error::The P12 must contain exactly one valid Developer ID Application identity'
            exit 1
          fi

          mkdir release-macos
          for arch in x86_64 arm64; do
            archive="workspace-desktop-macos-$arch.zip"
            app="$signing_dir/$arch/Workspace Desktop.app"
            ditto -x -k "macos-builds/$archive" "$signing_dir/$arch"
            codesign --force --keychain "$keychain" --sign "$identity" --options runtime --timestamp "$app"
            codesign --verify --strict "$app"
            ditto -c -k --keepParent "$app" "$signing_dir/$archive"
            xcrun notarytool submit "$signing_dir/$archive" --wait --output-format json \
              --key "$signing_dir/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
              | tee "$signing_dir/$arch-notary.json"
            jq -e '.status == "Accepted"' "$signing_dir/$arch-notary.json" > /dev/null
            xcrun stapler staple "$app"

            ditto -c -k --keepParent "$app" "release-macos/$archive"
            ditto -x -k "release-macos/$archive" "$signing_dir/verified/$arch"
            verified_app="$signing_dir/verified/$arch/Workspace Desktop.app"
            test -x "$verified_app/Contents/MacOS/workspace-desktop"
            codesign --verify --strict "$verified_app"
            xcrun stapler validate "$verified_app"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-packages
          path: release-macos/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created
    needs: [lint, test, package_macos_release, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: workspace-desktop-{linux,windows}-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-release-packages
          path: release-assets
      - name: Create the release with all four packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          options=(--verify-tag --title "Workspace Desktop $RELEASE_TAG")
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]]; then
            options+=(--notes-from-tag)
          else
            options+=(--generate-notes)
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${options[@]}" \
            'release-assets/workspace-desktop-linux-x64.tar.gz#Linux x64' \
            'release-assets/workspace-desktop-windows-x64.zip#Windows x64' \
            'release-assets/workspace-desktop-macos-x86_64.zip#macOS Intel x64' \
            'release-assets/workspace-desktop-macos-arm64.zip#macOS ARM64'
