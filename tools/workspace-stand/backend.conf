[db]
connection_url = postgresql://workspace:local-workspace-db@db:5432/workspace

[logging]
config = /backend/etc/workspace/logging.yaml

[iam]
iam_endpoint = http://iam:8080/api/core/v1/iam/clients/default
audience = workspace-stand

[workspace_api]
bind_host = 0.0.0.0
workers = 1

[messenger_events]
bind_host = 0.0.0.0

[messenger_worker_agent]
v2_projection_enabled = true
v2_projection_workers = 1

[messenger_files]
default_type = s3

[messenger_files_s3]
endpoint_url = http://s3:9000
bucket_name = workspace-attachments
access_key_id = workspace-stand
secret_access_key = local-workspace-s3
region_name = us-east-1
