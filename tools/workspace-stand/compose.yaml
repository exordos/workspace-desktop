name: workspace-desktop-stand

x-backend: &backend
  image: ${WORKSPACE_STAND_IMAGE:?}
  volumes:
    - ./bundle:/stand:ro

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: workspace
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: local-workspace-db
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "workspace", "-d", "workspace"]
      interval: 1s
      timeout: 3s
      retries: 30

  s3:
    image: ${WORKSPACE_STAND_MINIO_IMAGE:?}
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: workspace-stand
      MINIO_ROOT_PASSWORD: local-workspace-s3
    volumes:
      - attachments:/data

  iam:
    <<: *backend
    command: ["python", "/stand/iam.py"]
    env_file: accounts.env
    volumes:
      - ./bundle:/stand:ro
      - ./jwt.key:/keys/jwt.key:ro
      - ./tls/ca.pem:/keys/ca.pem:ro

  migrate:
    <<: *backend
    profiles: ["setup"]
    command: ["ra-apply-migration", "--config-file", "/stand/backend.conf", "--path", "/backend/migrations"]

  api:
    <<: *backend
    command: ["workspace-api", "--config-file", "/stand/backend.conf"]

  events:
    <<: *backend
    command: ["workspace-messenger-events", "--config-file", "/stand/backend.conf"]

  worker:
    <<: *backend
    command: ["workspace-messenger-worker", "--config-file", "/stand/backend.conf"]

  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${WORKSPACE_STAND_PORT:?}:443"
    volumes:
      - ./bundle/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls/server.pem:/tls/server.pem:ro
      - ./tls/server.key:/tls/server.key:ro
    depends_on: [iam, api, events]

volumes:
  postgres:
  attachments:
