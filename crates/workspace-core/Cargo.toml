[package]
name = "workspace-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
futures = "0.3"
hpke = { version = "=0.14.1", default-features = false, features = ["chacha", "x25519"] }
# Tungstenite logs raw handshake headers and frame data at TRACE.
log = { version = "0.4", features = ["max_level_debug"] }
markdown = "1.0.0"
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-native-roots"] }
ring = "0.17"
rusqlite = { version = "0.39", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
