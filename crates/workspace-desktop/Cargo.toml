[package]
name = "workspace-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
futures = "0.3"
log = "0.4"
iced = { version = "0.14.0", default-features = false, features = ["advanced", "canvas", "crisp", "image-without-codecs", "svg", "tokio", "tiny-skia", "wayland", "x11"], optional = true }
iced_runtime = { version = "0.14", optional = true }
rpassword = "7"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "signal", "sync", "time"] }
workspace-core = { path = "../workspace-core" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.5", optional = true }
objc2 = { version = "0.5", optional = true }
objc2-app-kit = { version = "0.2", features = ["NSWorkspace"], optional = true }
objc2-foundation = { version = "0.2", features = ["NSBundle", "NSUUID", "NSOperation", "block2"], optional = true }
objc2-user-notifications = { version = "0.2", features = ["UNError", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter", "block2"], optional = true }
security-framework = "3"

[features]
default = ["ui-kit"]
ui-kit = ["dep:iced", "dep:iced_runtime", "dep:block2", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-user-notifications"]

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iced_runtime = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "net"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = "0.29"
uuid = { version = "1", features = ["v4"] }

[[example]]
name = "ui_gallery"
required-features = ["ui-kit"]

[[bin]]
name = "workspace-desktop"
required-features = ["ui-kit"]
