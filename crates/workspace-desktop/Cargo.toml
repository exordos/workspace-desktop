[package]
name = "workspace-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
futures = "0.3"
iced = { version = "0.14.0", default-features = false, features = ["advanced", "canvas", "crisp", "svg", "thread-pool", "tiny-skia", "wayland", "x11"], optional = true }
rpassword = "7"
serde_json = "1"
tempfile = "3"
workspace-core = { path = "../workspace-core" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[features]
default = ["ui-kit"]
ui-kit = ["dep:iced"]

[[example]]
name = "ui_gallery"
required-features = ["ui-kit"]
