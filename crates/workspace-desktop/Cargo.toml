[package]
name = "workspace-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
futures = "0.3"
log = "0.4"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "signal", "sync", "time"] }
unicode-segmentation = { version = "1", optional = true }
uuid = "1"
workspace-core = { path = "../workspace-core" }

[target.'cfg(target_os = "macos")'.dependencies]
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"], optional = true }
icu_locale_core = { version = "2.4", optional = true }
icu_plurals = { version = "2.4", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
block2 = { version = "0.5", optional = true }
objc2 = { version = "0.5", optional = true }
objc2-app-kit = { version = "0.2", features = ["NSAppearance", "NSApplication", "NSGraphics", "NSResponder", "NSSound", "NSView", "NSWindow", "NSWorkspace"], optional = true }
objc2-foundation = { version = "0.2", features = ["NSBundle", "NSDate", "NSDateFormatter", "NSFormatter", "NSLocale", "NSTimeZone", "NSUUID", "NSOperation", "NSThread", "block2"], optional = true }
objc2-user-notifications = { version = "0.2", features = ["UNError", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter", "block2"], optional = true }
rust-i18n = { version = "4.2.4", optional = true }
security-framework = "3"
zeroize = { version = "1", optional = true }

[features]
default = ["gpui"]
macos-adapters = ["dep:block2", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-user-notifications"]
gpui = ["dep:base64", "dep:chrono", "dep:gpui", "dep:icu_locale_core", "dep:icu_plurals", "dep:image", "dep:rust-i18n", "dep:unicode-segmentation", "dep:zeroize", "macos-adapters"]
gpui-test = ["gpui", "gpui/test-support"]

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "net"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = "0.29"
uuid = { version = "1", features = ["v4"] }

[[example]]
name = "ui_gallery"
required-features = ["gpui"]

[[bin]]
name = "workspace-desktop"
required-features = ["gpui"]

[[example]]
name = "gpui_chat_probe"
required-features = ["gpui"]

[[example]]
name = "gpui_history_probe"
required-features = ["gpui"]

[[example]]
name = "gpui_editor_probe"
required-features = ["gpui"]

[[example]]
name = "gpui_macos_window_probe"
required-features = ["gpui"]

[target.'cfg(target_os = "macos")'.dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"

[[example]]
name = "ui_scene"
required-features = ["gpui"]
