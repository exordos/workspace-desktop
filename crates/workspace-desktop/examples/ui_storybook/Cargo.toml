[workspace]

[package]
name = "workspace-ui-storybook"
version = "0.1.0"
edition = "2024"
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false }
gpui-storybook = { version = "=0.5.0", default-features = false }
workspace-desktop = { path = "../.." }
es-fluent = "=0.2.9"
strum = { version = "0.27", features = ["derive"] }
unic-langid = "0.9"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["test-support"] }
